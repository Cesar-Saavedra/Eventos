spring.application.name=ms-eventos
server.port=8087

# Base de datos MySQL (XAMPP)
# Crea la BD "ms_eventos" en phpMyAdmin antes de correr el proyecto.
# Las tablas se crean automaticamente con ddl-auto=update
spring.datasource.url=jdbc:mysql://localhost:3307/ms_eventos
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT - DEBE SER EL MISMO SECRET QUE EN ms-login
# Con el mismo secret leemos el token sin llamar a ms-login
jwt.secret=c2VjcmV0b011eUZ1ZXJ0ZVBhcmFDYXJkTGlua1Byb3llY3RvRHVvYzIwMjY=
jwt.expiration=86400000

# URLs de los microservicios que este MS consulta
# ms-tiendas: para verificar que la tienda organizadora existe y esta activa
# ms-usuarios: para notificar cuando un jugador se inscribe a un evento
ms.tiendas.url=http://localhost:8084
ms.usuarios.url=http://localhost:8082
